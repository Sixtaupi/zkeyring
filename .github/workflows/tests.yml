name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # All tests in tests/, with local Vault, OpenBao and Infisical test services.
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the tests
        run: scripts/test-signing --infisical
