name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: zkeyring
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # This also installs the Python requirements of Zephyr and its modules.
      - name: Set up the Zephyr workspace
        uses: zephyrproject-rtos/action-zephyr-setup@cc223fe61661d8573c1cd3f95f72f90cce729ae9 # v1.0.16
        with:
          app-path: zkeyring
          manifest-file-name: west-dev.yml
          toolchains: arm-zephyr-eabi
          ccache-cache-key: ubuntu-24.04

      - name: Build the samples
        working-directory: zkeyring
        run: west twister -T samples -v --inline-logs --integration

      # Backends that need a service are covered by the signing workflow.
      - name: Run the signing tests
        working-directory: zkeyring
        shell: bash
        run: |
          python -m pip install --no-deps -e .
          python -m pytest -q -ra --tb=short --basetemp="$RUNNER_TEMP/zk" tests/signing
