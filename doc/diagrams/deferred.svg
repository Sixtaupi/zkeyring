<div class="zk-diagram">
<svg viewBox="0 0 800 190" role="img" aria-labelledby="def-title def-desc" xmlns="http://www.w3.org/2000/svg">
<title id="def-title">Deferred signing</title>
<desc id="def-desc">A build job without credentials passes three files to a protected signing job, which has backend access and publishes the signed image.</desc>
<defs><marker id="def-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path class="head" d="M0 0L8 4L0 8z"/></marker></defs>
<rect class="box" x="10" y="20" width="200" height="150" rx="8"/><text class="title" x="26" y="48">Build job</text><text class="small" x="26" y="72">No backend credentials</text><text class="mono" x="26" y="106">CONFIG_ZSIGNING=y</text><text class="mono" x="26" y="130">CONFIG_ZSIGNING_</text><text class="mono" x="26" y="148">DEFERRED=y</text>
<path class="line" d="M210 95H458" marker-end="url(#def-a)"/><text class="mono" x="262" y="60">zephyr/zephyr.bin</text><text class="mono" x="262" y="80">zkeyring-sign.json</text><text class="mono" x="262" y="122">zkeyring-public.pem</text>
<rect class="box key" x="460" y="20" width="200" height="150" rx="8"/><text class="title" x="476" y="48">Protected signing job</text><text class="small" x="476" y="72">Backend credentials</text><text class="mono" x="476" y="106">west zkeyring sign</text>
<path class="line" d="M660 95H698" marker-end="url(#def-a)"/><text class="title" x="706" y="91">Signed</text><text class="title" x="706" y="109">image</text>
</svg>
</div>
